<!DOCTYPE html>
<html>
<head>

<title>Complaint Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

body{
    font-family: Arial;
    background: lightgray;
}

.box{
    width:500px;
    background:white;
    margin:auto;
    margin-top:30px;
    padding:20px;
}

input,select,textarea,button{
    width:100%;
    padding:8px;
    margin-top:10px;
}

h2{
    text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h2>Public Complaint Form</h2>

<form id="form">

<input type="text" id="name" placeholder="Enter Name" required>

<input type="email" id="email" placeholder="Enter Email" required>

<select id="state" onchange="changeDistrict()" required>

<option value="">Select State</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Tamil Nadu</option>
<option>Goa</option>

</select>

<select id="district" required>
<option value="">Select District</option>
</select>

<input type="text" id="taluk" placeholder="Enter Taluk" required>

<select id="type" required>

<option value="">Complaint Type</option>
<option>Road Problem</option>
<option>Water Problem</option>
<option>Electricity Problem</option>
<option>Garbage Problem</option>
<option>Street Light Problem</option>

</select>

<textarea id="complaint" placeholder="Enter Complaint"></textarea>

<button type="button" onclick="sendOtp()">Send OTP</button>

<input type="text" id="otpBox" placeholder="Enter OTP">

<button type="button" onclick="verifyOtp()">Verify & Submit</button>

</form>

</div>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

let otp = "";

let data = {

Karnataka:["Dakshina Kannada","Udupi","Mysore"],
Kerala:["Kannur","Kasaragod","Wayanad"],
"Tamil Nadu":["Chennai","Madurai","Salem"],
Goa:["North Goa","South Goa"]

};

function changeDistrict(){

let state=document.getElementById("state").value;
let district=document.getElementById("district");

district.innerHTML="<option>Select District</option>";

for(let i=0;i<data[state].length;i++){

district.innerHTML += "<option>"+data[state][i]+"</option>";

}

}

function sendOtp(){

otp = Math.floor(100000 + Math.random()*900000);

let email=document.getElementById("email").value;
let name=document.getElementById("name").value;

let params = {

to_name:name,
to_email:email,
otp:otp

};

emailjs.send(
"YOUR_SERVICE_ID",
"YOUR_TEMPLATE_ID",
params
)

.then(function(){

alert("OTP Sent To Email");

});

}

function verifyOtp(){

let userOtp=document.getElementById("otpBox").value;

if(userOtp == otp){

let all=JSON.parse(localStorage.getItem("complaints")) || [];

let obj={

name:document.getElementById("name").value,
email:document.getElementById("email").value,
state:document.getElementById("state").value,
district:document.getElementById("district").value,
taluk:document.getElementById("taluk").value,
type:document.getElementById("type").value,
complaint:document.getElementById("complaint").value

};

all.push(obj);

localStorage.setItem("complaints",JSON.stringify(all));

alert("Complaint Registered Successfully");

document.getElementById("form").reset();

}

else{

alert("Wrong OTP");

}

}

</script>

</body>
</html>
